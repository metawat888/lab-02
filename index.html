<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenoDash 3D - Genomic Analytics</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #e0f2fe 100%);
            margin: 0;
            overflow: hidden; 
            color: #0f172a;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 10px;
        }

        /* Light Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 4px 6px rgba(15,23,42,0.05);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1);
        }

        .sequence-ticker {
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: ticker 20s linear infinite;
        }
        
        .seq-a { color: #ef4444; } 
        .seq-t { color: #3b82f6; } 
        .seq-c { color: #10b981; } 
        .seq-g { color: #f59e0b; } 

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .pulse-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            50% { opacity: .7; transform: scale(1.2); box-shadow: 0 0 10px 3px rgba(34, 197, 94, 0); }
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 h-screen w-screen relative">

    <canvas id="three-canvas" class="absolute inset-0 z-0 w-full h-full cursor-move"></canvas>

    <div class="absolute inset-0 z-10 p-3 md:p-5 flex flex-col justify-between pointer-events-none h-full">
        
        <div class="w-full flex flex-col gap-3 relative z-50 pointer-events-none max-w-7xl mx-auto">
            
            <!-- TOP HEADER -->
            <header class="glass-panel rounded-2xl p-3 flex flex-col md:flex-row justify-between items-center pointer-events-auto gap-3 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
                <div class="flex items-center justify-between w-full md:w-auto">
                    <div class="flex items-center gap-3 shrink-0">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 border border-blue-400 flex items-center justify-center text-white shadow-md">
                            <i class="fa-solid fa-dna text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-lg md:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-cyan-600 tracking-tight">GenoDash 3D</h1>
                            <p class="text-[9px] md:text-[10px] text-slate-500 font-medium flex items-center gap-1">
                                <i class="fa-solid fa-check-circle text-emerald-500"></i> <span class="text-emerald-600">อ้างอิง NCBI / ClinVar</span>
                            </p>
                        </div>
                    </div>
                    
                    <button id="btn-toggle-mobile" class="md:hidden bg-blue-50 text-blue-700 px-3 py-2 rounded-xl text-xs font-bold border border-blue-200 active:bg-blue-100 shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie"></i> ข้อมูล
                    </button>
                </div>
                
                <div class="relative w-full md:flex-1 md:max-w-xl mx-auto">
                    <select id="sample-selector" class="w-full bg-white/90 backdrop-blur-md border border-slate-300 text-slate-800 text-[11px] md:text-sm font-bold rounded-xl focus:ring-blue-500 focus:border-blue-500 block pl-4 pr-8 py-2.5 outline-none transition-all hover:border-blue-400 cursor-pointer appearance-none shadow-sm">
                        <option value="hbb_normal">1. โครงสร้าง DNA ปกติ (ยีน HBB อ้างอิง)</option>
                        <option value="hbb_sickle">2. โรคโลหิตจางเม็ดเลือดแดงรูปเคียว (HBB)</option>
                        <option value="cftr_mut">3. โรคซิสติกไฟโบรซิส (CFTR)</option>
                        <option value="fgfr3_mut">4. โรคกระดูกอ่อนเตี้ยแคระ (FGFR3)</option>
                        <option value="pah_mut">5. โรคฟีนิลคีโตนูเรีย PKU (PAH)</option>
                        <option value="hfe_mut">6. โรคภาวะธาตุเหล็กเกิน (HFE)</option>
                        <option value="nf1_mut">7. โรคท้าวแสนปม (NF1)</option>
                        <option value="ldlr_mut">8. คอเลสเตอรอลสูงทางพันธุกรรม (LDLR)</option>
                        <option value="smn1_mut">9. โรคกล้ามเนื้ออ่อนแรง SMA (SMN1)</option>
                        <option value="braf_mut">10. มะเร็งเมลาโนมา (BRAF V600E)</option>
                        <option value="fbn1_mut">11. กลุ่มอาการมาร์ฟาน (FBN1)</option>
                        <option value="f8_mut">12. โรคเลือดไหลไม่หยุด ฮีโมฟีเลีย (F8)</option>
                        <option value="hexa_mut">13. โรคเทย์-แซกส์ (HEXA)</option>
                        <option value="serpina1_mut">14. ภาวะพร่องเอนไซม์ Alpha-1 (SERPINA1)</option>
                        <option value="galt_mut">15. โรคแพ้น้ำตาลนม กาแลคโตซีเมีย (GALT)</option>
                        <option value="dmd_mut">16. โรคกล้ามเนื้อเสื่อมดูเชน (DMD)</option>
                        <option value="atp7b_mut">17. โรควิลสัน ทองแดงสะสม (ATP7B)</option>
                        <option value="gba_mut">18. โรคโกเชร์ ไขมันสะสม (GBA)</option>
                        <option value="tyr_mut">19. ภาวะผิวเผือก (TYR)</option>
                        <option value="opn1lw_mut">20. โรคตาบอดสีแดง-เขียว (OPN1LW)</option>
                        <option value="tp53_mut">21. มะเร็งทั่วไป / ลำไส้ใหญ่ (ยีน TP53)</option>
                        <option value="egfr_mut">22. มะเร็งปอดชนิดเซลล์ไม่เล็ก (EGFR)</option>
                        <option value="brca1_mut">23. มะเร็งเต้านมและรังไข่ (BRCA1)</option>
                        <option value="pik3ca_mut">24. มะเร็งทางเดินอาหาร/เต้านม (PIK3CA)</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
                    </div>
                </div>

                <div class="hidden md:flex items-center gap-4 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-green-500 pulse-dot"></div>
                        <span class="text-[11px] font-semibold text-slate-600">เรียลไทม์</span>
                    </div>
                    <div class="h-6 w-px bg-slate-300"></div>
                    <button id="btn-toggle-desktop" class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-2 min-w-[120px] justify-center">
                        <i class="fa-solid fa-eye-slash" id="toggle-icon"></i> <span id="toggle-text">ซ่อนข้อมูล</span>
                    </button>
                </div>
            </header>

            <div id="data-panel" class="pointer-events-auto transition-all duration-300 origin-top opacity-100 transform scale-y-100 max-h-[60vh] overflow-y-auto hide-scroll">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4">
                    
                    <!-- 1. รายละเอียด -->
                    <div class="glass-card rounded-xl p-4 border-blue-200 bg-white/90 lg:col-span-2 shadow-sm flex flex-col justify-center min-h-[90px]">
                        <label class="text-[10px] md:text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 block"><i class="fa-solid fa-circle-info mr-1"></i> รายละเอียดทางพันธุกรรม</label>
                        <p id="sample-desc" class="text-[11px] md:text-xs text-slate-700 leading-relaxed font-medium">กำลังโหลดข้อมูล...</p>
                    </div>

                    <!-- 2. โครโมโซม -->
                    <div class="glass-card rounded-xl p-3 md:p-4 border-blue-200 bg-gradient-to-br from-blue-50 to-white shadow-sm flex flex-col justify-between min-h-[90px]">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] md:text-[11px] font-bold text-slate-700 uppercase tracking-wider"><i class="fa-solid fa-dna text-blue-500 mr-1"></i> โครโมโซม</span>
                            <span id="chr-number" class="bg-blue-100 text-blue-700 border border-blue-200 text-[9px] md:text-[10px] px-2 py-0.5 rounded-full font-bold">...</span>
                        </div>
                        <div class="flex justify-between items-center mt-auto pt-2">
                            <span class="text-[10px] text-slate-500">พิกัด (Locus):</span>
                            <span id="chr-locus" class="text-[11px] md:text-xs font-black text-slate-800 font-mono bg-white px-2 py-0.5 rounded border border-slate-200 shadow-sm">...</span>
                        </div>
                    </div>

                    <!-- 3. Base Composition (Added) -->
                    <div class="glass-card rounded-xl p-3 md:p-4 shadow-sm flex flex-col justify-center min-h-[90px] bg-white/90">
                        <span class="text-[10px] md:text-[11px] font-bold text-slate-700 uppercase mb-2"><i class="fa-solid fa-chart-simple text-blue-500 mr-1"></i> องค์ประกอบเบส</span>
                        <div class="grid grid-cols-2 gap-x-3 gap-y-2 text-[9px] font-mono">
                            <div><div class="flex justify-between"><span class="text-red-500 font-bold">A</span> <span id="val-a" class="text-slate-600 font-bold">0%</span></div><div class="w-full bg-slate-200 h-1 mt-0.5 rounded-full overflow-hidden"><div id="bar-a" class="bg-red-500 h-full rounded-full transition-all duration-500"></div></div></div>
                            <div><div class="flex justify-between"><span class="text-blue-500 font-bold">T</span> <span id="val-t" class="text-slate-600 font-bold">0%</span></div><div class="w-full bg-slate-200 h-1 mt-0.5 rounded-full overflow-hidden"><div id="bar-t" class="bg-blue-500 h-full rounded-full transition-all duration-500"></div></div></div>
                            <div><div class="flex justify-between"><span class="text-emerald-500 font-bold">C</span> <span id="val-c" class="text-slate-600 font-bold">0%</span></div><div class="w-full bg-slate-200 h-1 mt-0.5 rounded-full overflow-hidden"><div id="bar-c" class="bg-emerald-500 h-full rounded-full transition-all duration-500"></div></div></div>
                            <div><div class="flex justify-between"><span class="text-amber-500 font-bold">G</span> <span id="val-g" class="text-slate-600 font-bold">0%</span></div><div class="w-full bg-slate-200 h-1 mt-0.5 rounded-full overflow-hidden"><div id="bar-g" class="bg-amber-500 h-full rounded-full transition-all duration-500"></div></div></div>
                        </div>
                    </div>

                    <!-- 4. จุดกลายพันธุ์ / ความสมบูรณ์ -->
                    <div class="relative min-h-[90px]">
                        <div id="mutation-card" class="absolute inset-0 glass-card rounded-xl p-3 md:p-4 border-red-200 bg-red-50/95 hidden transition-all shadow-md flex-col justify-between z-10">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] md:text-[11px] font-bold text-red-600 uppercase tracking-wider"><i class="fa-solid fa-crosshairs mr-1 animate-pulse"></i> จุดกลายพันธุ์</span>
                                <span id="mut-position" class="bg-white text-red-600 border border-red-200 text-[9px] md:text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">...</span>
                            </div>
                            <div class="flex items-center justify-around bg-white/80 rounded-lg p-1.5 border border-red-100 mt-auto">
                                <div class="text-center">
                                    <div class="text-[8px] font-bold text-slate-500 uppercase">ปกติ</div>
                                    <div id="mut-normal" class="text-base font-black text-emerald-500">A</div>
                                </div>
                                <i class="fa-solid fa-arrow-right-long text-red-500 text-sm animate-pulse"></i>
                                <div class="text-center">
                                    <div class="text-[8px] font-bold text-slate-500 uppercase">พบจริง</div>
                                    <div id="mut-mutated" class="text-base font-black text-red-500">T</div>
                                </div>
                            </div>
                        </div>

                        <div id="integrity-card" class="absolute inset-0 glass-card rounded-xl p-3 md:p-4 shadow-sm flex flex-col justify-center bg-white/90">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] md:text-[11px] font-semibold text-slate-500 uppercase tracking-wider">ความสมบูรณ์</span>
                                <i id="integrity-icon" class="fa-solid fa-shield-halved text-emerald-500"></i>
                            </div>
                            <div id="integrity-score" class="text-xl md:text-2xl font-black text-slate-800 leading-none">100%</div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full mt-3 overflow-hidden">
                                <div id="integrity-bar" class="bg-gradient-to-r from-emerald-400 to-emerald-500 w-full h-full rounded-full transition-all duration-1000"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="glass-panel rounded-2xl overflow-hidden pointer-events-auto flex items-center h-10 md:h-12 relative shrink-0 mt-auto max-w-7xl mx-auto w-full shadow-[0_-4px_20px_rgb(0,0,0,0.03)]">
            <div class="bg-blue-50/90 border-r border-blue-100 h-full px-3 md:px-5 flex items-center justify-center z-10 shrink-0 backdrop-blur-md">
                <span class="text-blue-700 text-[9px] md:text-[10px] font-bold tracking-widest uppercase"><i class="fa-solid fa-satellite-dish mr-2 animate-pulse"></i> ลำดับพันธุกรรม</span>
            </div>
            <div class="flex-1 overflow-hidden relative h-full flex items-center bg-white/60 backdrop-blur-sm">
                <div class="absolute inset-y-0 left-0 w-8 bg-gradient-to-r from-white/80 to-transparent z-10"></div>
                <div class="absolute inset-y-0 right-0 w-8 bg-gradient-to-l from-white/80 to-transparent z-10"></div>
                <div class="sequence-ticker text-[11px] md:text-sm tracking-[0.25em] font-bold text-slate-700" id="sequence-container">
                    <!-- Javascript populates -->
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const genomicData = {
            hbb_normal: { id: "HBB-WT", integrity: 100, desc: "ยีน HBB (Hemoglobin Beta) ลำดับเบสอ้างอิงจาก NCBI มีความสมบูรณ์ ถอดรหัสเป็นกรดกลูตามิก (Glu) ที่ตำแหน่ง 6 อย่างถูกต้อง", seq: "ATGGTGCACCTGACTCCTGAGGAGAAGTCTGCCGTTACTGCCCTGTGGGGCAAGGTGAACGTGGATGAAGTTGGTGGTGAGGCCCTGGGCAGGTTGGTATCAAGGTTACAAGACAGGTTTAAGGAGACCAATAGAAACTGGGCATGTGGAGACAGAGAAG", mutationIdx: -1, normalBase: null, mutatedBase: null, displayPos: "" },
            hbb_sickle: { id: "HBB-SCA", integrity: 65, desc: "โรคโลหิตจางเม็ดเลือดแดงรูปเคียว: พบการกลายพันธุ์ Point Mutation แบบ Transversion (A > T) ส่งผลให้กรดกลูตามิกเปลี่ยนเป็นวาลีน (Glu6Val)", seq: "ATGGTGCACCTGACTCCTGTGGAGAAGTCTGCCGTTACTGCCCTGTGGGGCAAGGTGAACGTGGATGAAGTTGGTGGTGAGGCCCTGGGCAGGTTGGTATCAAGGTTACAAGACAGGTTTAAGGAGACCAATAGAAACTGGGCATGTGGAGACAGAGAAG", mutationIdx: 19, normalBase: "A", mutatedBase: "T", displayPos: "c.17A>T (rs334)" },
            braf_mut: { id: "BRAF-V600E", integrity: 42, desc: "มะเร็งเมลาโนมา: การกลายพันธุ์ที่ Exon 15 ของยีน BRAF (T > A) เปลี่ยนวาลีนเป็นกลูตามิก (Val600Glu) ทำให้ไคเนสทำงานตลอดเวลาโดยไม่อาศัยสัญญาณกระตุ้น", seq: "TGTTTTCCTTTACTTACTACACCTCAGATATATTTCTTCATGAAGACCTCACAGTAAAAATAGGTGATTTTGGTCTAGCTACAGAGAAATCTCGATGGAGTGGGTCCCATCAGTTTGAACAGTTGTCTGGATCCATTTTGTGGATGGTAAGAATTGAGGC", mutationIdx: 84, normalBase: "T", mutatedBase: "A", displayPos: "c.1799T>A" },
            cftr_mut: { id: "CFTR-G551D", integrity: 78, desc: "โรคซิสติกไฟโบรซิส: การกลายพันธุ์ที่ Exon 11 (G > A) เปลี่ยนไกลซีนเป็นกรดแอสปาร์ติก (Gly551Asp) ส่งผลให้ช่องผ่านคลอไรด์ที่ผิวเซลล์ไม่สามารถเปิดออกได้", seq: "TTCAGAGGGATCCAGAAACAAACTAACTTGAGGAAAATGAAAACTTGAATACAGGCATATAGCCCAAAAACAAAGGAAAAACCAGGCACCGTTATAAAACGGGAACATGGTTGGAAGTTGAATCCTAGAAGGTGATAGAAGAATGCCTATGCACCCGG", mutationIdx: 50, normalBase: "G", mutatedBase: "A", displayPos: "c.1652G>A" },
            fgfr3_mut: { id: "FGFR3-G1138A", integrity: 85, desc: "โรคกระดูกอ่อนเตี้ยแคระ (Achondroplasia): การกลายพันธุ์ที่ยีน FGFR3 (G > A) ส่งผลให้ตัวรับสัญญาณยับยั้งการเจริญเติบโตของกระดูกทำงานมากเกินไป", seq: "CTGCCCCGCCGCCGGGCGTCCTCTACTTTCACCAGGCGGCCGACATGGTGAGTCTACACGGCCCGGGGCCCCGGGGGACGGGAGCAGTCCACCGACGGCGTGCCCGGGCGACGGGACCGACCGGGATCTCCCGGCGCCGCCGCCCCCCGCACCCGCAGGG", mutationIdx: 50, normalBase: "G", mutatedBase: "A", displayPos: "c.1138G>A" },
            pah_mut: { id: "PAH-R408W", integrity: 60, desc: "โรคฟีนิลคีโตนูเรีย (PKU): การกลายพันธุ์ในยีน PAH (C > T) ทำให้เอนไซม์ Phenylalanine Hydroxylase เสียสภาพ ไม่สามารถย่อยกรดอะมิโนฟีนิลอะลานีนได้", seq: "CCCATGGTTATGACCTTCGGGATGATTGTACAGGGGTACTTGATGTCCAGTAGGTGCTTGTAGTTGTGCTTTTTTCCGCCTTCTGGATTCTTCTCATCCAGCAAAATGGGCTTGGGAAAGGAGTTAATGATTTGTAGCCCTGTCAGTTGATTTTGAGCAA", mutationIdx: 50, normalBase: "C", mutatedBase: "T", displayPos: "c.1222C>T" },

                points.push(new THREE.Vector3(x, y, z));

            return new THREE.Mesh(geo, mat);

        chrGroup.add(p2);
        const c2 = new THREE.Mesh(capGeo, chrMat); c2.position.set(0.35, 1.2, 0); chrGroup.add(c2);

        const q1 = new THREE.Mesh(armGeoLong, chrMat); q1.position.set(-0.25, -0.9, 0); q1.rotation.z = -Math.PI/12; 
        q1.add(createCoil(1.8, 0.1, 18)); 
        chrGroup.add(q1);
        const cq1 = new THREE.Mesh(capGeoLong, chrMat); cq1.position.set(-0.45, -1.8, 0); chrGroup.add(cq1);
        
        const q2 = new THREE.Mesh(armGeoLong, chrMat); q2.position.set(0.25, -0.9, 0); q2.rotation.z = Math.PI/12; 
        q2.add(createCoil(1.8, 0.1, 18));
        chrGroup.add(q2);
        const cq2 = new THREE.Mesh(capGeoLong, chrMat); cq2.position.set(0.45, -1.8, 0); chrGroup.add(cq2);

        const indicatorMat = new THREE.MeshPhysicalMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
        const indicatorGroup = new THREE.Group();
        
        const indicatorDotL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), indicatorMat);
        const indicatorDotR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), indicatorMat);
        
        const indicatorLightL = new THREE.PointLight(0xff0000, 0.6, 1.5);
        const indicatorLightR = new THREE.PointLight(0xff0000, 0.6, 1.5);
        
        indicatorDotL.add(indicatorLightL);
        indicatorDotR.add(indicatorLightR);
        
        indicatorGroup.add(indicatorDotL);
        indicatorGroup.add(indicatorDotR);
        chrGroup.add(indicatorGroup);

        // ผูกโครโมโซมติดกับกล้องให้แสดงผลแบบ HUD (ขยับตามกล้องเสมอ)
        camera.add(chrGroup);

        // กำหนดมุมเริ่มต้น
        const baseChrRotY = Math.PI / 4;
        const baseChrRotZ = Math.PI / 12;
        chrGroup.rotation.y = baseChrRotY; 
        chrGroup.rotation.z = baseChrRotZ;

        // เพิ่ม Raycaster สำหรับตรวจจับการคลิก/สัมผัสโครโมโซม
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDraggingChromosome = false;
        let isDraggingDNA = false;
        let previousPointer = { x: 0, y: 0 };

        function updateChromosomePosition() {
            const dist = 10;
            const vFov = (camera.fov * Math.PI) / 180;
            const height = 2 * Math.tan(vFov / 2) * dist; 
            const width = height * camera.aspect;
            
            const isMobile = window.innerWidth < 768;
            const isTablet = window.innerWidth >= 768 && window.innerWidth < 1024;

            if (isMobile) {
                // บนมือถือ ลดขนาดและย้ายมาอยู่มุมซ้ายล่าง เพื่อไม่ให้บังข้อมูลและ DNA
                chrGroup.position.set(-width / 2 + 1.0, -height / 2 + 2.2, -dist); 
                chrGroup.scale.set(0.35, 0.35, 0.35);
            } else if (isTablet) {
                // บน iPad ลดขนาดลงเล็กน้อย จัดให้อยู่มุมซ้ายบน
                chrGroup.position.set(-width / 2 + 1.5, height / 2 - 3.2, -dist); 
                chrGroup.scale.set(0.45, 0.45, 0.45);
            } else {
                // บน PC ปกติ (มุมซ้ายบน)
                chrGroup.position.set(-width / 2 + 1.8, height / 2 - 2.8, -dist); 
                chrGroup.scale.set(0.6, 0.6, 0.6);
            }
        }
        updateChromosomePosition();
        // ----------------------------------------------------

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.enableZoom = false; 
        controls.enablePan = false; 

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight1.position.set(20, 20, 20);
        scene.add(dirLight1);
        const rimLight = new THREE.DirectionalLight(0x2563eb, 0.8);
        rimLight.position.set(-20, 0, -20);
        scene.add(rimLight);

        const backboneMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x1e293b, emissive: 0x000000, metalness: 0.6, roughness: 0.15, clearcoat: 1.0, clearcoatRoughness: 0.1
        });

        const matA = new THREE.MeshPhysicalMaterial({ color: 0xe11d48, emissive: 0xe11d48, emissiveIntensity: 0.1, metalness: 0.2, roughness: 0.15, clearcoat: 1.0 });
        const matT = new THREE.MeshPhysicalMaterial({ color: 0x1d4ed8, emissive: 0x1d4ed8, emissiveIntensity: 0.1, metalness: 0.2, roughness: 0.15, clearcoat: 1.0 });
        const matC = new THREE.MeshPhysicalMaterial({ color: 0x047857, emissive: 0x047857, emissiveIntensity: 0.1, metalness: 0.2, roughness: 0.15, clearcoat: 1.0 });
        const matG = new THREE.MeshPhysicalMaterial({ color: 0xc2410c, emissive: 0xc2410c, emissiveIntensity: 0.1, metalness: 0.2, roughness: 0.15, clearcoat: 1.0 });
        
        const matMutated = new THREE.MeshPhysicalMaterial({ 
            color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1.5, roughness: 0.1, clearcoat: 1.0
        });

        const atomGeo = new THREE.SphereGeometry(0.55, 16, 16);
        const baseAtomGeo = new THREE.SphereGeometry(0.45, 16, 16);
        let dnaGroup = new THREE.Group();
        scene.add(dnaGroup);

        let blinkLights = [];
        let blinkMaterials = [];

        function buildDNA(sequence, mutationIdx, data = null) {
            while(dnaGroup.children.length > 0){ dnaGroup.remove(dnaGroup.children[0]); }
            blinkLights = []; blinkMaterials = [];

            if (data && data.mutationIdx > -1) {
                indicatorGroup.visible = true;
                let targetY = 0;
                let targetX = 0;
                let ratio = Math.abs(data.chrPos);

                if (data.chrPos > 0) {
                    targetY = ratio * 1.2;
                    targetX = ratio * 0.35;
                } else {
                    targetY = -ratio * 1.8;
                    targetX = ratio * 0.45;
                }
                
                indicatorDotL.position.set(-targetX, targetY, 0);
                indicatorDotR.position.set(targetX, targetY, 0);
                
                blinkMaterials.push(indicatorMat);
                blinkLights.push(indicatorLightL);
                blinkLights.push(indicatorLightR);
            } else {
                indicatorGroup.visible = false;
            }

            const numPairs = sequence.length;
            const radius = 4.2;
            const verticalSpacing = 1.3; 
            const twistRate = 0.598; 
            const minorGrooveAngle = 2.4; 
            
            const strand1Points = [];
            const strand2Points = [];
            const startY = -(numPairs * verticalSpacing) / 2;

            for (let i = 0; i < numPairs; i++) {
                const angle = i * twistRate;
                const y = startY + (i * verticalSpacing);

                const p1 = new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
                const p2 = new THREE.Vector3(Math.cos(angle + minorGrooveAngle) * radius, y, Math.sin(angle + minorGrooveAngle) * radius);
                const center = new THREE.Vector3(0, y, 0);

                strand1Points.push(p1); strand2Points.push(p2);

                const bbAtom1 = new THREE.Mesh(atomGeo, backboneMaterial); bbAtom1.position.copy(p1);
                const bbAtom2 = new THREE.Mesh(atomGeo, backboneMaterial); bbAtom2.position.copy(p2);
                dnaGroup.add(bbAtom1); dnaGroup.add(bbAtom2);

                const baseChar = sequence[i];
                let m1, m2;
                if (baseChar === 'A') { m1 = matA; m2 = matT; }
                else if (baseChar === 'T') { m1 = matT; m2 = matA; }
                else if (baseChar === 'C') { m1 = matC; m2 = matG; }
                else if (baseChar === 'G') { m1 = matG; m2 = matC; }

                const isMutation = (i === mutationIdx);
                if (isMutation) {
                    m1 = matMutated.clone(); 
                    const mutLight = new THREE.PointLight(0xff0000, 2, 20);
                    mutLight.position.copy(center);
                    dnaGroup.add(mutLight);
                    blinkLights.push(mutLight);
                    blinkMaterials.push(m1);
                    
                    dnaGroup.userData.mutCenter = center.clone();

                    const cylinderGeo = new THREE.CylinderGeometry(5.8, 5.8, 3.8, 32, 1, true);
                    const cylinderMat = new THREE.MeshPhysicalMaterial({
                        color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.5,
                        transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false
                    });
                    const mutBox = new THREE.Mesh(cylinderGeo, cylinderMat);
                    mutBox.position.copy(center);
                    
                    const edgesGeo = new THREE.EdgesGeometry(cylinderGeo);
                    const edgesMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
                    const mutBoxEdges = new THREE.LineSegments(edgesGeo, edgesMat);
                    mutBox.add(mutBoxEdges);

                    dnaGroup.add(mutBox);
                    blinkMaterials.push(cylinderMat);
                }

                const path1 = new THREE.LineCurve3(p1, center);
                const path2 = new THREE.LineCurve3(p2, center);
                const rung1 = new THREE.Mesh(new THREE.TubeGeometry(path1, 2, isMutation ? 0.35 : 0.2, 8, false), m1);
                const rung2 = new THREE.Mesh(new THREE.TubeGeometry(path2, 2, 0.2, 8, false), m2);
                
                const bAtom1 = new THREE.Mesh(baseAtomGeo, m1);
                bAtom1.position.copy(p1).lerp(center, 0.4);
                if(isMutation) bAtom1.scale.set(1.4, 1.4, 1.4); 

                const bAtom2 = new THREE.Mesh(baseAtomGeo, m2);
                bAtom2.position.copy(p2).lerp(center, 0.4);

                dnaGroup.add(rung1); dnaGroup.add(rung2);
                dnaGroup.add(bAtom1); dnaGroup.add(bAtom2);
            }

            const strand1Curve = new THREE.CatmullRomCurve3(strand1Points);
            const strand2Curve = new THREE.CatmullRomCurve3(strand2Points);
            dnaGroup.add(new THREE.Mesh(new THREE.TubeGeometry(strand1Curve, numPairs * 2, 0.35, 12, false), backboneMaterial));
            dnaGroup.add(new THREE.Mesh(new THREE.TubeGeometry(strand2Curve, numPairs * 2, 0.35, 12, false), backboneMaterial));
            
            dnaGroup.rotation.z = Math.PI / 10;
            dnaGroup.rotation.x = Math.PI / 16;
            
            dnaGroup.updateMatrixWorld();
            
            // ปรับระยะห่างกล้องอัตโนมัติตามขนาดหน้าจอ เพื่อไม่ให้ DNA ใหญ่ล้นจอในมือถือ
            const isMobile = window.innerWidth < 768;
            const isTablet = window.innerWidth >= 768 && window.innerWidth < 1024;
            const cameraZ = isMobile ? 65 : (isTablet ? 55 : 45);

            if(mutationIdx > -1 && dnaGroup.userData.mutCenter) {
                const worldPos = dnaGroup.userData.mutCenter.clone().applyMatrix4(dnaGroup.matrixWorld);
                controls.target.copy(worldPos); 
                camera.position.set(worldPos.x, worldPos.y, worldPos.z + cameraZ);
            } else {
                controls.target.set(0, 0, 0);
                camera.position.set(0, 0, cameraZ);
            }
        }

        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 800; 
        const posArray = new Float32Array(particlesCount * 3);
        
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 150;
        }
        
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.25, // ขยายขนาดฝุ่นละอองนิดหน่อย
            color: 0x1d4ed8, // เปลี่ยนละอองพาร์ติเคิลเป็นสีน้ำเงินเข้ม
            transparent: true,
            opacity: 0.6, // เพิ่มความทึบให้มองเห็นบนพื้นขาว
            blending: THREE.NormalBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // ขยับ HUD โครโมโซมให้เข้าที่เมื่อขนาดหน้าจอเปลี่ยน
            updateChromosomePosition(); 
            
            // อัปเดตระยะซูมกล้องเมื่อหมุนหน้าจอ หรือเปลี่ยนขนาดหน้าจอ
            const isMobile = window.innerWidth < 768;
            const isTablet = window.innerWidth >= 768 && window.innerWidth < 1024;
            const targetZ = isMobile ? 65 : (isTablet ? 55 : 45);
            
            // รักษาระยะ Z ให้สัมพันธ์กับพิกัดที่กำลังโฟกัสอยู่
            camera.position.z = controls.target.z + targetZ;
        }, false);

        document.getElementById('sample-selector').addEventListener('change', (e) => {
            updateUI(e.target.value);
        });

        let isPanelVisible = true;
        const dataPanel = document.getElementById('data-panel');
        const btnDesktop = document.getElementById('btn-toggle-desktop');
        const btnMobile = document.getElementById('btn-toggle-mobile');
        const toggleText = document.getElementById('toggle-text');
        const toggleIcon = document.getElementById('toggle-icon');

        function togglePanel() {
            isPanelVisible = !isPanelVisible;
            if (isPanelVisible) {
                dataPanel.style.display = 'block';
                setTimeout(() => {
                    dataPanel.style.opacity = '1';
                    dataPanel.style.transform = 'translateY(0) scaleY(1)';
                }, 10);
                
                toggleText.innerText = 'ซ่อนข้อมูล';
                toggleIcon.className = 'fa-solid fa-eye-slash';
                btnDesktop.classList.replace('from-slate-500', 'from-blue-600');
                btnDesktop.classList.replace('to-slate-600', 'to-blue-500');
                
                btnMobile.innerHTML = '<i class="fa-solid fa-eye-slash"></i> ซ่อน';
                btnMobile.classList.replace('bg-slate-100', 'bg-blue-50');
                btnMobile.classList.replace('text-slate-600', 'text-blue-700');
            } else {
                dataPanel.style.opacity = '0';
                dataPanel.style.transform = 'translateY(-10px) scaleY(0.95)';
                setTimeout(() => {
                    dataPanel.style.display = 'none';
                }, 300);
                
                toggleText.innerText = 'ดูข้อมูล';
                toggleIcon.className = 'fa-solid fa-eye';
                btnDesktop.classList.replace('from-blue-600', 'from-slate-500');
                btnDesktop.classList.replace('to-blue-500', 'to-slate-600');
                
                btnMobile.innerHTML = '<i class="fa-solid fa-eye"></i> ดูข้อมูล';
                btnMobile.classList.replace('bg-blue-50', 'bg-slate-100');
                btnMobile.classList.replace('text-blue-700', 'text-slate-600');
            }
        }

        btnDesktop.addEventListener('click', togglePanel);
        btnMobile.addEventListener('click', togglePanel);

        // ป้องกันการลากเพื่อเลื่อนหน้าจอของเบราว์เซอร์ (เพื่อไม่ให้ขัดจังหวะการหมุน 3D บนมือถือ)
        canvas.style.touchAction = 'none';

        canvas.addEventListener('wheel', (event) => {
            const scrollSpeed = 0.05;
            controls.target.y -= event.deltaY * scrollSpeed;
            camera.position.y -= event.deltaY * scrollSpeed;
        }, { passive: true });

        // รวมการควบคุมลากเมาส์และสัมผัสจอ (Pointer Events)
        canvas.addEventListener('pointerdown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            // ตรวจสอบว่าคลิก/แตะ โดนโครโมโซมหรือไม่ (ตรวจสอบลึกถึงชิ้นส่วนย่อย)
            const intersects = raycaster.intersectObject(chrGroup, true);
            
            if (intersects.length > 0) {
                isDraggingChromosome = true; // ลากเพื่อหมุนโครโมโซม
            } else {
                isDraggingDNA = true; // ลากเพื่อเลื่อนสาย DNA
            }
            previousPointer = { x: e.clientX, y: e.clientY };
            canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDraggingChromosome && !isDraggingDNA) return;

            const deltaX = e.clientX - previousPointer.x;
            const deltaY = e.clientY - previousPointer.y;
            
            if (isDraggingChromosome) {
                // หมุนโครโมโซมอย่างอิสระทั้งแกน X และ Y
                chrGroup.rotation.y += deltaX * 0.015;
                chrGroup.rotation.x += deltaY * 0.015;
            } else if (isDraggingDNA) {
                // เลื่อนหน้าจอสาย DNA ขึ้น/ลง
                const swipeSpeed = 0.08;
                controls.target.y += deltaY * swipeSpeed;
                camera.position.y += deltaY * swipeSpeed;
            }
            previousPointer = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('pointerup', (e) => {
            isDraggingChromosome = false;
            isDraggingDNA = false;
            canvas.releasePointerCapture(e.pointerId);
        });
        
        canvas.addEventListener('pointercancel', (e) => {
            isDraggingChromosome = false;
            isDraggingDNA = false;
            canvas.releasePointerCapture(e.pointerId);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            particlesMesh.rotation.y = elapsedTime * 0.01;
            particlesMesh.rotation.x = elapsedTime * 0.005;
            
            dnaGroup.position.y = Math.sin(elapsedTime * 0.5) * 0.8;

            const pulse = (Math.sin(elapsedTime * 10) + 1) / 2; 
            blinkLights.forEach(light => { light.intensity = 1 + (pulse * 8); });
            blinkMaterials.forEach(mat => { mat.emissiveIntensity = 1 + (pulse * 5); });

            const maxY = 150;
            if (controls.target.y > maxY) {
                const diff = controls.target.y - maxY;
                controls.target.y = maxY;
                camera.position.y -= diff;
            } else if (controls.target.y < -maxY) {
                const diff = controls.target.y - (-maxY);
                controls.target.y = -maxY;
                camera.position.y -= diff;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            updateUI('hbb_normal');
            animate();
        };
    </script>
</body>
</html>
